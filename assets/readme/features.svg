<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw Beautify Github Readme 特性总览</title>
  <desc id="desc">八个特性卡片：双模式、项目原生、三种实现、渲染级验证、中文适配、双主题安全、只读审计、归因可选。</desc>

  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="352" rx="28" fill="#10151F"/>

  <!-- Card 1: 双模式 -->
  <g transform="translate(40 20)">
    <rect width="265" height="146" rx="16" fill="#1A2130" stroke="#2A3346" stroke-width="1"/>
    <g transform="translate(22 18)">
      <rect x="2" y="8" width="14" height="26" rx="4" fill="#F5C842"/>
      <rect x="24" y="8" width="14" height="26" rx="4" fill="none" stroke="#8B93A7" stroke-width="2"/>
      <path d="M21 12 L21 30" stroke="#5A6478" stroke-width="2" stroke-dasharray="2 3"/>
    </g>
    <text class="t" x="22" y="102" fill="#F4F6FA" font-size="22" font-weight="700">双模式</text>
    <text class="t" x="22" y="125" fill="#B9C0CF" font-size="17">整份 README · 纯素材</text>
  </g>

  <!-- Card 2: 项目原生 -->
  <g transform="translate(325 20)">
    <rect width="265" height="146" rx="16" fill="#1A2130" stroke="#2A3346" stroke-width="1"/>
    <g transform="translate(22 18)">
      <circle cx="10" cy="10" r="7" fill="#F5C842"/>
      <circle cx="30" cy="10" r="7" fill="#8B93A7"/>
      <circle cx="10" cy="30" r="7" fill="none" stroke="#B9C0CF" stroke-width="2"/>
      <circle cx="30" cy="30" r="7" fill="none" stroke="#5A6478" stroke-width="2"/>
    </g>
    <text class="t" x="22" y="102" fill="#F4F6FA" font-size="22" font-weight="700">项目原生</text>
    <text class="t" x="22" y="125" fill="#B9C0CF" font-size="17">一仓一视觉，不套模板</text>
  </g>

  <!-- Card 3: 三种实现 -->
  <g transform="translate(610 20)">
    <rect width="265" height="146" rx="16" fill="#1A2130" stroke="#2A3346" stroke-width="1"/>
    <g transform="translate(22 18)">
      <rect x="2" y="4" width="36" height="10" rx="5" fill="none" stroke="#8B93A7" stroke-width="2"/>
      <rect x="2" y="15" width="36" height="10" rx="5" fill="#F5C842"/>
      <rect x="2" y="26" width="36" height="10" rx="5" fill="none" stroke="#B9C0CF" stroke-width="2"/>
    </g>
    <text class="t" x="22" y="102" fill="#F4F6FA" font-size="22" font-weight="700">三种实现</text>
    <text class="t" x="22" y="125" fill="#B9C0CF" font-size="17">纯 SVG · Hybrid · GIF</text>
  </g>

  <!-- Card 4: 渲染级验证 -->
  <g transform="translate(895 20)">
    <rect width="265" height="146" rx="16" fill="#1A2130" stroke="#2A3346" stroke-width="1"/>
    <g transform="translate(22 18)">
      <circle cx="16" cy="16" r="12" fill="none" stroke="#B9C0CF" stroke-width="2.5"/>
      <path d="M25 25 L34 34" stroke="#B9C0CF" stroke-width="3" stroke-linecap="round"/>
      <path d="M10.5 16.5 L14.5 20.5 L22 11.5" fill="none" stroke="#F5C842" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="t" x="22" y="102" fill="#F4F6FA" font-size="22" font-weight="700">渲染级验证</text>
    <text class="t" x="22" y="125" fill="#B9C0CF" font-size="17">无头渲染 + WCAG 对比度</text>
  </g>

  <!-- Card 5: 中文适配 -->
  <g transform="translate(40 186)">
    <rect width="265" height="146" rx="16" fill="#1A2130" stroke="#2A3346" stroke-width="1"/>
    <g transform="translate(22 10)">
      <text class="t" x="0" y="34" fill="#F5C842" font-size="30" font-weight="800">中</text>
      <text class="t" x="34" y="24" fill="#B9C0CF" font-size="22" font-weight="800">A</text>
      <rect x="34" y="30" width="1.5" height="14" fill="#5A6478"/>
    </g>
    <text class="t" x="22" y="102" fill="#F4F6FA" font-size="22" font-weight="700">中文适配</text>
    <text class="t" x="22" y="125" fill="#B9C0CF" font-size="17">微软雅黑 · 中英字宽对齐</text>
  </g>

  <!-- Card 6: 双主题安全 -->
  <g transform="translate(325 186)">
    <rect width="265" height="146" rx="16" fill="#1A2130" stroke="#2A3346" stroke-width="1"/>
    <g transform="translate(22 18)">
      <path d="M20 6 A14 14 0 0 0 20 34 Z" fill="#D7DDE8"/>
      <path d="M20 6 A14 14 0 0 1 20 34 Z" fill="#3A4458"/>
      <circle cx="20" cy="20" r="14" fill="none" stroke="#5A6478" stroke-width="1.5"/>
      <circle cx="27" cy="12" r="2.2" fill="#F5C842"/>
    </g>
    <text class="t" x="22" y="102" fill="#F4F6FA" font-size="22" font-weight="700">双主题安全</text>
    <text class="t" x="22" y="125" fill="#B9C0CF" font-size="17">GitHub 深浅主题都清晰</text>
  </g>

  <!-- Card 7: 只读审计 -->
  <g transform="translate(610 186)">
    <rect width="265" height="146" rx="16" fill="#1A2130" stroke="#2A3346" stroke-width="1"/>
    <g transform="translate(22 16)">
      <ellipse cx="20" cy="19" rx="11" ry="8.5" fill="none" stroke="#B9C0CF" stroke-width="2"/>
      <circle cx="20" cy="19" r="3" fill="#F5C842"/>
      <path d="M10 34 L30 34" stroke="#5A6478" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text class="t" x="22" y="102" fill="#F4F6FA" font-size="22" font-weight="700">只读审计</text>
    <text class="t" x="22" y="125" fill="#B9C0CF" font-size="17">先体检，再动手改</text>
  </g>

  <!-- Card 8: 归因可选 -->
  <g transform="translate(895 186)">
    <rect width="265" height="146" rx="16" fill="#1A2130" stroke="#2A3346" stroke-width="1"/>
    <g transform="translate(22 18)">
      <path d="M20 5 L23.4 13.4 L32.5 14.2 L25.6 20 L27.8 28.9 L20 24.3 L12.2 28.9 L14.4 20 L7.5 14.2 L16.6 13.4 Z" fill="#F5C842"/>
    </g>
    <text class="t" x="22" y="102" fill="#F4F6FA" font-size="22" font-weight="700">归因可选</text>
    <text class="t" x="22" y="125" fill="#B9C0CF" font-size="17">自愿加项目原生签名</text>
  </g>
</svg>
