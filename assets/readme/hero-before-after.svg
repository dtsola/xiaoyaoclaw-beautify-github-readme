<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw Beautify Github Readme：一个 README 的 Before 与 After</title>
  <desc id="desc">左右对比两张 README 卡片：左侧改造前是灰暗无层次的信息堆，右侧改造后是结构清晰、有视觉层次的页面，中间黄色箭头表示转变。</desc>

  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#10151F"/>

  <!-- eyebrow -->
  <text class="mono" x="56" y="52" fill="#F5C842" font-size="15" font-weight="700" letter-spacing="2.5">BEFORE → AFTER · OPENCLAW SKILL</text>

  <!-- title + subtitle -->
  <text class="t" x="56" y="108" fill="#F4F6FA" font-size="46" font-weight="800">一个 README 的 Before 与 After</text>
  <text class="t" x="56" y="146" fill="#B9C0CF" font-size="20" font-weight="500">信息堆 vs 门面——先让人看懂，再谈视觉。</text>

  <!-- ============ BEFORE card ============ -->
  <g transform="translate(56 176)">
    <rect width="480" height="148" rx="14" fill="#121826" stroke="#232C40" stroke-width="1"/>

    <!-- window bar (greyed) -->
    <circle cx="26" cy="18" r="4" fill="#3A4458"/>
    <circle cx="42" cy="18" r="4" fill="#3A4458"/>
    <circle cx="58" cy="18" r="4" fill="#3A4458"/>
    <text class="mono" x="440" y="23" text-anchor="end" fill="#8B93A7" font-size="13">README.md</text>
    <path d="M20 34 L460 34" stroke="#232C40" stroke-width="1"/>

    <!-- dull title bar -->
    <rect x="20" y="48" width="210" height="14" rx="7" fill="#2A3346"/>

    <!-- X badge, aligned to the middle of the text block -->
    <circle cx="442" cy="100" r="15" fill="none" stroke="#FF5F57" stroke-width="2" opacity="0.75"/>
    <path d="M435.5 93.5 L448.5 106.5 M448.5 93.5 L435.5 106.5" stroke="#FF5F57" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    <!-- messy text bars: uneven widths, no hierarchy -->
    <rect x="20" y="72" width="300" height="8" rx="4" fill="#33405A"/>
    <rect x="20" y="86" width="380" height="8" rx="4" fill="#2A3346"/>
    <rect x="20" y="100" width="260" height="8" rx="4" fill="#33405A"/>
    <rect x="20" y="114" width="340" height="8" rx="4" fill="#2A3346"/>
    <rect x="20" y="128" width="290" height="8" rx="4" fill="#33405A"/>
  </g>

  <!-- ============ arrow ============ -->
  <g>
    <rect x="566" y="240" width="44" height="20" rx="10" fill="#F5C842"/>
    <path d="M612 240 L632 250 L612 260 Z" fill="#F5C842"/>
  </g>

  <!-- ============ AFTER card ============ -->
  <g transform="translate(664 176)">
    <rect width="480" height="148" rx="14" fill="#1A2130" stroke="#2A3346" stroke-width="1"/>

    <!-- window bar -->
    <circle cx="26" cy="18" r="4" fill="#FF5F57"/>
    <circle cx="42" cy="18" r="4" fill="#FEBC2E"/>
    <circle cx="58" cy="18" r="4" fill="#28C840"/>
    <text class="mono" x="440" y="23" text-anchor="end" fill="#8B93A7" font-size="13">README.md</text>
    <path d="M20 34 L460 34" stroke="#2A3346" stroke-width="1"/>

    <!-- mini hero: yellow accent title + supporting lines -->
    <rect x="20" y="44" width="440" height="38" rx="8" fill="#232C40"/>
    <rect x="32" y="54" width="150" height="10" rx="5" fill="#F5C842"/>
    <rect x="32" y="70" width="240" height="6" rx="3" fill="#5A6478"/>

    <!-- section header + icon row -->
    <rect x="20" y="94" width="110" height="9" rx="4.5" fill="#F4F6FA"/>
    <rect x="392" y="92" width="14" height="14" rx="4" fill="#F5C842"/>
    <rect x="412" y="92" width="14" height="14" rx="4" fill="#63D3BE"/>
    <rect x="432" y="92" width="14" height="14" rx="4" fill="#8B93A7"/>

    <!-- tidy body lines + CTA -->
    <rect x="20" y="114" width="380" height="6" rx="3" fill="#5A6478"/>
    <rect x="20" y="126" width="320" height="6" rx="3" fill="#5A6478"/>

    <!-- check badge -->
    <circle cx="442" cy="124" r="15" fill="#F5C842"/>
    <path d="M434.5 124 L439.5 129 L449.5 118.5" fill="none" stroke="#10151F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
